name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Structure Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "No zip file found!"
          exit 1
        fi
        echo "Extracting $ZIP_FILE..."
        unzip -q -o "$ZIP_FILE" -d temp_extracted
        
        GRADLEW_FILE=$(find temp_extracted -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_FILE" ]; then
          echo "Error: gradlew file not found inside zip!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_FILE")
        echo "Project root found at $PROJECT_DIR"
        cp -rn "$PROJECT_DIR"/* .
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
