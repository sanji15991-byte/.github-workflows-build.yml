name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        unzip -o "$ZIP_FILE" -d temp_extracted
        
        # Check and copy project root files
        FOUND_DIR=$(find temp_extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
        if [ -n "$FOUND_DIR" ]; then
          echo "Copying from $FOUND_DIR"
          cp -r $FOUND_DIR/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant permissions to gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
